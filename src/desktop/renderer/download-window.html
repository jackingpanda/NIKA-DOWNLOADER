<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Status - NIKA DOWNLOADER</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="download-window-body">
  <!-- Frameless Draggable Titlebar -->
  <div class="titlebar download-window-titlebar">
    <div class="titlebar-drag-region">
      <div class="app-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <span class="brand-name">NIKA <span class="brand-highlight">DOWNLOADER</span></span>
      </div>
      <div class="download-window-title-tag" id="window-status-pill">Connecting...</div>
    </div>
    <div class="window-controls">
      <button class="win-btn" id="btn-win-minimize" title="Minimize" type="button">
        <svg viewBox="0 0 12 12"><rect y="5" width="10" height="1.5" fill="currentColor"></rect></svg>
      </button>
      <button class="win-btn win-btn-close" id="btn-win-close" title="Close" type="button">
        <svg viewBox="0 0 12 12"><polygon points="11 1.5 9.5 0 5.5 4 1.5 0 0 1.5 4 5.5 0 9.5 1.5 11 5.5 7 9.5 11 11 9.5 7 5.5" fill="currentColor"></polygon></svg>
      </button>
    </div>
  </div>

  <!-- Main Content Container with Polished Cards -->
  <div class="download-window-container">
    <!-- Telemetry Key Metrics Tiles (4 balanced cards in 1 row) -->
    <div class="indiv-metrics-row">
      <div class="indiv-metric-card">
        <span class="indiv-metric-label">STATUS</span>
        <div class="indiv-metric-val indiv-stat-value-flex">
          <span id="indiv-status-text" class="indiv-status-main">Connecting...</span>
          <span class="indiv-resumable-tag" id="indiv-resumable-badge" title="Server Resume capability">Resume: --</span>
        </div>
      </div>
      <div class="indiv-metric-card">
        <span class="indiv-metric-label">DOWNLOADED / SIZE</span>
        <div class="indiv-metric-val mono-val">
          <span id="indiv-downloaded-size">0 B</span>
          <span class="indiv-metric-sep">/</span>
          <span id="indiv-file-size" style="color: var(--text-sub);">--</span>
        </div>
      </div>
      <div class="indiv-metric-card">
        <span class="indiv-metric-label">TRANSFER RATE</span>
        <div class="indiv-metric-val mono-val indiv-speed-val" id="indiv-transfer-rate">--</div>
      </div>
      <div class="indiv-metric-card">
        <span class="indiv-metric-label">ESTIMATED TIME (ETA)</span>
        <div class="indiv-metric-val mono-val" id="indiv-time-left" style="color: #cbd5e1;">--</div>
      </div>
    </div>

    <!-- Master Overall Progress Bar Card -->
    <div class="indiv-progress-card">
      <div class="indiv-progress-header">
        <span class="indiv-progress-label" id="indiv-file-title" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 580px;">Download Progress</span>
        <span class="indiv-progress-percent" id="indiv-progress-percent-label">0.0%</span>
      </div>
      <div class="indiv-overall-bar">
        <div class="indiv-overall-fill" id="indiv-overall-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Destination & Source Card -->
    <div class="indiv-location-card">
      <div class="indiv-loc-row">
        <span class="indiv-loc-label">Save To:</span>
        <div class="indiv-loc-field">
          <svg class="indiv-loc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span class="indiv-stat-value mono-val indiv-path-text" id="indiv-file-path" title="Directory path">--</span>
          <button class="btn-sm btn-secondary indiv-action-chip" id="btn-indiv-open-folder-inline" type="button" title="Open directory in File Explorer">Browse</button>
        </div>
      </div>
      <div class="indiv-loc-row">
        <span class="indiv-loc-label">URL:</span>
        <div class="indiv-loc-field">
          <svg class="indiv-loc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span class="indiv-stat-value mono-val indiv-url-text" id="indiv-source-url" title="...">https://...</span>
          <button class="btn-sm btn-secondary indiv-action-chip" id="btn-indiv-copy-url" type="button" title="Copy download URL">Copy</button>
        </div>
      </div>
    </div>

    <!-- Multi-Segment Active HTTP Range Visualizer Card -->
    <div class="indiv-segments-card">
      <div class="indiv-segments-header">
        <div class="indiv-threads-heading">
          <span class="indiv-pulse-indicator"></span>
          <span>Active Connections (<span id="indiv-thread-count">0</span> threads)</span>
        </div>
        <span class="indiv-prealloc-badge">Zero-Copy Sparse Preallocation</span>
      </div>
      <div class="indiv-segments-grid" id="indiv-segments-grid">
        <div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 14px; font-size: 11.5px;">Waiting for connection allocation...</div>
      </div>
    </div>
  </div>

  <!-- Footer Controls -->
  <div class="indiv-modal-footer download-window-footer">
    <div class="indiv-footer-left">
      <label class="indiv-close-on-complete-label">
        <input type="checkbox" id="indiv-close-on-complete">
        <span>Close dialog when download completes</span>
      </label>
    </div>
    <div class="indiv-footer-actions">
      <button class="btn-sm btn-primary-action" id="btn-indiv-open-file" type="button" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span>Open File</span>
      </button>
      <button class="btn-sm btn-secondary" id="btn-indiv-open-folder" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        <span>Open Folder</span>
      </button>
      <button class="btn-sm btn-secondary" id="btn-indiv-pause-resume" type="button">
        <span id="indiv-pause-resume-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" style="width: 14px; height: 14px;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </span>
        <span id="indiv-pause-resume-label">Pause</span>
      </button>
      <button class="btn-sm btn-danger-action" id="btn-indiv-cancel" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 13px; height: 13px;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        <span>Cancel</span>
      </button>
      <button class="btn-sm btn-secondary" id="btn-indiv-close" type="button">Close</button>
    </div>
  </div>

  <script src="download-window.js"></script>
</body>
</html>
